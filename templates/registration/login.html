{% extends "base.html" %}

{% block title %}Entrar | El Broncas ERP{% endblock %}
{% block page_title %}Entrar{% endblock %}

{% block content %}
<section class="auth-panel">
  <form method="post" class="form-card">
    {% csrf_token %}
    <label>
      Usuario
      {{ form.username }}
    </label>
    <label>
      Contraseña
      {{ form.password }}
    </label>
    {% if form.errors %}
      <p class="error-text">Usuario o contraseña incorrectos.</p>
    {% endif %}
    <button class="primary-button" type="submit">Entrar</button>
  </form>
</section>
{% endblock %}
