{% extends "base.html" %}

{% block title %}Cambiar contraseña | El Broncas ERP{% endblock %}
{% block page_title %}Cambiar contraseña{% endblock %}

{% block content %}
<section class="auth-panel">
  <form method="post" class="form-card">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <label>
      Contraseña actual
      {{ form.old_password }}
      {{ form.old_password.errors }}
    </label>
    <label>
      Nueva contraseña
      {{ form.new_password1 }}
      {{ form.new_password1.errors }}
    </label>
    <label>
      Confirmar nueva contraseña
      {{ form.new_password2 }}
      {{ form.new_password2.errors }}
    </label>
    <button class="primary-button" type="submit">Guardar contraseña</button>
  </form>
</section>
{% endblock %}
